.gnff .ing5t{font-weight:800;font-size:19px;color:var(--red);letter-spacing:-.2px}
.gnff .ing5s{font-size:13.5px;color:var(--ink-soft)}
.gnff .ing5 ol{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.gnff .ing5 li{display:flex;align-items:center;gap:10px;background:#fff;border-radius:10px;padding:8px 10px;font-size:16px;font-weight:600;color:var(--ink);line-height:1.3}
.gnff .ing5 .n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
.gnff .ing5 li.an .n{background:var(--red)}
.gnff .ing5 .t{flex:1}
.gnff .ing5 .tag{flex:none;font-size:11.5px;font-weight:700;color:var(--red);background:#FDE4E8;border-radius:999px;padding:3px 9px;white-space:nowrap}
@media (max-width:480px){.gnff .ing5 .tag{display:none}.gnff .ing5 li.an .t::after{content:"Meat, fish or egg";display:block;font-weight:600;font-size:12px;color:var(--red);margin-top:2px}}

/* subtle comparison tip at the top of results */
.gnff .howto{margin:22px 0 4px;padding:12px 16px;border-radius:14px;background:#F3F0E9;font-size:14.5px;line-height:1.55;color:var(--ink-soft)}
.gnff .howto b{color:var(--ink);font-weight:700}
.gnff .howto-k{font-family:var(--script);font-size:21px;color:var(--red);margin-right:4px}

/* approach group banners */
.gnff .grp-h{display:flex;align-items:center;gap:16px;margin:38px 0 16px;padding:16px 18px 16px 16px;border-radius:20px;background:var(--gc);color:var(--gi)}
.gnff .grp-nat{--gc:#E91D3A;--gi:#fff;--bc:#FFC714;--bi:#463B3C}
.gnff .grp-sci{--gc:#463B3C;--gi:#fff;--bc:#F68D21;--bi:#fff}
.gnff .grp-loc{--gc:#F68D21;--gi:#fff;--bc:#fff;--bi:#E91D3A}
.gnff .grp-b{flex:0 0 74px;height:74px;border-radius:50%;background:var(--bc);color:var(--bi);display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--script);font-size:19px;line-height:1;padding:8px;transform:rotate(-8deg)}
.gnff .grp-h h3{margin:0;font-size:22px;font-weight:800;letter-spacing:-.2px;color:var(--gi);line-height:1.2}
.gnff .grp-h p{margin:4px 0 0;font-size:14.5px;line-height:1.45;color:var(--gi);opacity:.92}
.gnff .grp-h .grp-x{margin-top:8px;font-size:13.5px;opacity:.85}
@media (max-width:480px){.gnff .grp-b{flex-basis:58px;height:58px;font-size:15px}.gnff .grp-h h3{font-size:19px}}

/* cost per day badge in the ingredients panel; meat ingredients in green */
.gnff .ing5h{justify-content:space-between;align-items:flex-start;flex-wrap:nowrap}
.gnff .ing5hl{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.gnff .ing5c{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;width:84px;height:84px;margin:-4px -4px 0 8px;border-radius:50%;background:var(--red);color:#fff;text-align:center;line-height:1.05;transform:rotate(-6deg)}
.gnff .ing5c b{font-size:22px;font-weight:800}
.gnff .ing5c span{font-family:var(--script);font-size:18px}
.gnff .ing5c[hidden]{display:none}
.gnff .ing5 li.an .n{background:#0E9547}
.gnff .ing5 .tag{color:#0B7A3A;background:#DDF2E3}
@media (max-width:480px){.gnff .ing5c{width:70px;height:70px}.gnff .ing5c b{font-size:19px}.gnff .ing5c span{font-size:16px}.gnff .ing5 li.an .t::after{color:#0B7A3A}}

  /* Acana pâté for cats: kitten recipe for kittens, otherwise matched to the top pick's protein */

  if (youngW) html+='<div class="notice">If '+esc(pet())+' looks a bit chubby, it\'s usually about portion size rather than changing food. Would you like to speak to a human about how much to feed? <a href="'+CONTACT+'">Chat to our team</a></div>';
  if (conc==="joints") html+='<div class="notice">If '+esc(pet())+' has been diagnosed with arthritis or is on joint medication, keep your vet in the loop when you change food.</div>';
  if (r.relaxed) html+='<div class="notice">We couldn\'t find a grain-free match for these answers, so we\'ve included recipes with wholesome grains.</div>';
  html+='<div class="howto"><span class="howto-k">Comparing foods?</span> Check <b>what\u2019s in it</b> and <b>the cost per day</b>, not just the bag price.</div>';
  var GH={nat:{t:'Natural and high in meat',b:'Go natural',s:'Real meat first. Prices rise from Diamond Naturals to Orijen as the meat goes up.',x:gnText},sci:{t:'Vet-science formulated',b:'Science led',s:'Balanced by vets and nutritionists for size, life stage and specific needs.'},loc:{t:'Proudly South African',b:'Made in SA',s:'Local recipes with good everyday nutrition at a lower price.'}}, lastG=null;
  r.options.forEach(function(o,i){ var g=GROUP[o.b]; if(g!==lastG){ lastG=g; var G=GH[g];
    html+='<div class="grp-h grp-'+g+'"><span class="grp-b" aria-hidden="true">'+G.b+'</span><div><h3>'+G.t+'</h3><p>'+G.s+'</p>'+(G.x?'<p class="grp-x">'+G.x+'</p>':'')+'</div></div>'; }
    html+=cardHtml(o.p,"o"+i,true,TIER[o.b],"lad",o.alts); });
  if (r.topper||r.pate) html+='<h3 class="sec-title">Make the bowl irresistible</h3>';
  if (r.pate){
    var ap=r.pate;
    html+='<div class="topper" style="margin-bottom:14px">'+pack({b:"acana",n:ap.n,h:ap.h},true)+
     '<div><h3 style="font-family:var(--serif);font-size:20px;margin:0 0 6px">'+esc(ap.n)+'</h3>'+
     '<p style="margin:0 0 12px">'+(A.age==="kitten"?'A smooth, protein-rich pâté in bone broth made for growing kittens.':'A protein-rich pâté in bone broth from the same family as Acana dry food.')+' Mix a spoonful into the dry food or serve it as a meal.</p>'+
     '<div class="buyrow"><button type="button" class="btn btn-ghost" data-vid="'+ap.v[0][1]+'"'+(ap.v[0][3]===false?' disabled':'')+'>'+(ap.v[0][3]===false?'Sold out online':'Add to cart, R'+rand(ap.v[0][2])+' a can')+'</button><a class="plink" href="/products/'+ap.h+'">View product</a></div></div></div>';
  }
  if (r.topper){
    var t=r.topper, td=t.v.length-1;
    html+='<div class="topper">'+pack({b:"weruva",n:t.n,h:t.h},true)+
     '<div><h3 style="font-family:var(--serif);font-size:20px;margin:0 0 6px">'+esc(t.n)+'</h3>'+
     '<p style="margin:0 0 12px">Mix a spoonful of Weruva into the dry food for extra moisture and real-meat flavour. Great for fussy eaters and for rotating flavours so they never get bored.</p>'+
     '<div class="buyrow"><button type="button" class="btn btn-ghost" data-vid="'+t.v[td][1]+'"'+(t.v[td][3]===false?' disabled':'')+'>'+(t.v[td][3]===false?'Sold out online':'Add to cart, R'+rand(t.v[td][2]))+'</button><a class="plink" href="/products/'+t.h+'">View product</a></div></div></div>';
  }
  html+='<div class="sticker"><div aria-hidden="true">'+badge()+'</div><div><h4>Look for the Go Natural sticker on pack</h4><p>Every food in our Go Natural range (Orijen, Acana, Taste of the Wild and Diamond Naturals) starts with real meat, adds whole natural ingredients and leaves out fillers and artificial additives.</p></div></div>';
  html+='<div class="email"><h4>Email me '+esc(pet())+'\'s match</h4><p style="margin:0">We\'ll send your picks and a simple guide to switching foods.</p>'+
   '<form id="gnff-em" novalidate><label class="sr" for="gnff-eml">Email address</label><input id="gnff-eml" type="email" required placeholder="you@email.com" autocomplete="email"><button class="btn btn-red" type="submit">Send my match</button></form>'+
   (CFG.list?'<label class="optin"><input type="checkbox" id="gnff-optin"> Also send me Canine&amp;Co news, tips and offers. You can unsubscribe at any time.</label>':'')+
   '<div id="gnff-emr" aria-live="polite"></div></div>';
  if (A.avoid.length) html+='<p class="fine">We checked every recipe\'s full ingredient list and left out anything made with (or possibly made with) '+A.avoid.join(" or ")+' meat, meal, liver or broth. Fats and oils are fine: they contain no protein, which is what pets react to.</p>';
  if (showDaily() && (A.age==="puppy"||A.age==="kitten")) html+='<p class="fine">Daily cost uses each brand\'s '+(A.age==="puppy"?'puppy':'kitten')+' feeding guide for '+esc(pet())+'\'s age and current weight'+(A.age==="puppy"?' (and expected adult size where the chart uses it)':'')+', priced on the biggest bag. Portions grow as '+esc(pet())+' does, so this cost will change month to month. Where a recipe has no '+(A.age==="puppy"?'puppy':'kitten')+' chart, we estimate from the brand\'s guidance and mark it "estimated".</p>';
  else if (showDaily()) html+='<p class="fine">Daily cost uses each brand\'s feeding guide for a '+A.weight+'kg '+(A.sp==="cat"?"cat":"dog")+' with average activity, priced on the biggest bag. Where a brand gives no chart, we estimate from the calories in the food. Every pet is different, so adjust to keep '+esc(pet())+' in good shape.</p>';
  html+='<p class="fine">Switch foods gradually over 7 to 10 days, mixing a little more of the new food in each day. If your pet has a known allergy, always check the full ingredient list on the product page.</p>';
  html+='<div class="res-actions"><button class="btn btn-ghost" id="gnff-change">Change my answers</button><button class="back" id="gnff-again">Start again</button></div>';
  html+='</div></section>';
  app.innerHTML=html;
  r.options.forEach(function(o,i){ wireSizes(o.p,"o"+i); });
  track("food_finder_complete",{species:A.sp,life_stage:A.age,goal:A.goal,concern:A.concern,digestion_type:A.digtype,novel_protein:A.novel?A.novel.join(","):null,top_pick:r.top.n});
  document.getElementById("gnff-rh").focus({preventScroll:true});
  gnffTop();
  document.getElementById("gnff-change").onclick=function(){ step=0; renderStep(); };
  document.getElementById("gnff-again").onclick=function(){ reset(); renderIntro(); };
  document.getElementById("gnff-em").onsubmit=function(e){
    e.preventDefault(); var v=document.getElementById("gnff-eml").value.trim(), out=document.getElementById("gnff-emr");
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){ out.innerHTML='<p class="done" style="color:var(--red)">Please enter a valid email address.</p>'; return; }
    var btn=e.target.querySelector("button"); btn.disabled=true;
    var oi=document.getElementById("gnff-optin");
    sendKlaviyo(v, oi&&oi.checked, r).then(function(){ out.innerHTML='<p class="done">Sent. Check your inbox for '+esc(pet())+'\'s match.</p>'; track("food_finder_email",{optin:!!(oi&&oi.checked)}); })
      .catch(function(){ btn.disabled=false; out.innerHTML='<p class="done" style="color:var(--red)">Sorry, that didn\'t go through. Please try again.</p>'; });
  };
}

function sendKlaviyo(email,optin,r){
  if(!CFG.klaviyo) return Promise.reject();
  var url=function(p){ return p? location.origin+"/products/"+p.h : null; };
  var props={pet_name:A.name||null,species:A.sp,life_stage:A.age,weight_kg:A.weight||null,expected_adult_kg:A.adultw||null,
    concern:A.concern,avoid:A.avoid.join(", ")||"none",grain:A.grain,budget:A.budget,
    top_pick:r.top?r.top.n:null,top_pick_url:url(r.top),top_pick_image:r.top&&IMG[r.top.h]?IMG_BASE+IMG[r.top.h]:null,
    runner_up:r.runner?r.runner.n:null,runner_up_url:url(r.runner),
    wet_food:r.pate?r.pate.n:(r.topper?r.topper.n:null),wet_food_url:url(r.pate||r.topper),source:"Canine&Co food finder",
    options:(r.options||[]).map(function(o){ return {tier:TIER[o.b],brand:BRANDS[o.b].name,name:o.p.n,url:url(o.p),image:IMG[o.p.h]?IMG_BASE+IMG[o.p.h]:null}; })};
  var H={"Content-Type":"application/vnd.api+json","Accept":"application/vnd.api+json","revision":CFG.revision||"2025-07-15"};
  var base="https://a.klaviyo.com/client/";
  var ev=fetch(base+"events/?company_id="+encodeURIComponent(CFG.klaviyo),{method:"POST",headers:H,body:JSON.stringify({data:{type:"event",attributes:{
    properties:props,metric:{data:{type:"metric",attributes:{name:"Food Finder Completed"}}},
    profile:{data:{type:"profile",attributes:{email:email,properties:{food_finder_species:A.sp,food_finder_pet_name:A.name||null,food_finder_top_pick:props.top_pick}}}}}}})})
    .then(function(x){ if(!x.ok) throw 0; });
  if(!optin||!CFG.list) return ev;
  var sub=fetch(base+"subscriptions/?company_id="+encodeURIComponent(CFG.klaviyo),{method:"POST",headers:H,body:JSON.stringify({data:{type:"subscription",attributes:{
    custom_source:"Canine&Co food finder",profile:{data:{type:"profile",attributes:{email:email,subscriptions:{email:{marketing:{consent:"SUBSCRIBED"}}}}}}},
    relationships:{list:{data:{type:"list",id:CFG.list}}}}})}).then(function(x){ if(!x.ok) throw 0; });
  return Promise.all([ev,sub]);
}
track("food_finder_view");
if (/[?&](gnff_rx=sent|contact_posted=true)/.test(location.search)) renderRxThanks(); else renderIntro();
})();

</script>
